[package]
name = "yournotify"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Official Rust SDK for Yournotify engagement, automations, loyalty, referrals and rewards"
repository = "https://github.com/yournotify/yournotify-rust"

[dependencies]
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hmac = "0.12"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
